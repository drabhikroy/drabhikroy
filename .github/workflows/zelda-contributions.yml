
name: Zelda Contributions

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate Zelda animation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/zelda_contributions.py

      - name: Commit updated animation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img/zelda-contributions.svg
          if ! git diff --cached --quiet; then
            git commit -m "Update Zelda contribution animation [skip ci]"
            git push
          fi
