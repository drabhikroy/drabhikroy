<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 52" width="800" height="52">
  <style>
    .badge {
      font-family: ALSHauss-Regular, 'ALS Hauss', sans-serif;
      font-size: 26px;
      color: #ffffff;
      background-color: #21262d;
      padding: 4px 16px;
      border-radius: 6px;
      display: inline-block;
    }
    @media (prefers-color-scheme: light) {
      .badge { 
        color: #24292f; 
        background-color: #f6f8fa; 
      }
    }
  </style>
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; justify-content: center; align-items: center; height: 100%;">
      <span class="badge">ᴍᴇᴛʜᴏᴅᴏʟᴏɢɪꜱᴛ &#160;·&#160; ᴘʀᴏɢʀᴀᴍ ᴇᴠᴀʟᴜᴀᴛᴏʀ &#160;·&#160; ʀ ᴇɴᴛʜᴜꜱɪᴀꜱᴛ</span>
    </div>
  </foreignObject>
</svg>
