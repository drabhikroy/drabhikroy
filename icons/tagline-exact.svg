<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 38" style="background: transparent;">
  <style>
    :root {
      color-scheme: light dark;
    }
    text {
      font-family: ALSHauss-Regular, 'ALS Hauss';
      font-size: 26px;
      fill: #ffffff;
      fill: light-dark(#24292f, #ffffff);
    }
