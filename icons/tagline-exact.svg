  </style>
  <text x="360" y="28" text-anchor="middle">ᴍᴇᴛʜᴏᴅᴏʟᴏɢɪꜱᴛ &#160;·&#160; ᴘʀᴏɢʀᴀᴍ ᴇᴠᴀʟᴜᴀᴛᴏʀ &#160;·&#160; ʀ ᴇɴᴛʜᴜꜱɪᴀꜱᴛ</text>
</svg>
